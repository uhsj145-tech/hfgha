    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #fcfcfc;
            color: #333;
            padding: 40px 20px;
        }

        .image-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .image-link {
            display: block;
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .image-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .image-link img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .image-container {
                gap: 15px;
            }

            .image-link {
                border-radius: 8px;
            }
        }
    </style>
</head>
